services:
  - type: web
    name: martech-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/system/live
    envVars:
      - key: APP_ENV
        value: development
      - key: LLM_PROVIDER
        value: openrouter
      - key: RUN_EMBEDDED_WORKER
        value: "true"
      - key: OPENROUTER_API_KEY
        sync: false

