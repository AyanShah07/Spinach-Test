name: Project checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: martech_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd 'redis-cli ping' --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/martech_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/martech_test
      TEST_REDIS_URL: redis://localhost:6379/15
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt
      - name: Install dependencies (single requirements.txt, no lock files)
        run: |
          uv venv
          uv pip install -r requirements.txt
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest app/tests -q
